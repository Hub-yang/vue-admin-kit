# 三个包声明的 peerDependencies / dependencies 用的是 pnpm 的 `catalog:` 协议，
# 版本的唯一来源是消费仓库自己的 pnpm-workspace.yaml。
#
# **把下面这些条目合并进你那个 monorepo 的 `catalog:` 块**，否则 `pnpm install` 会直接失败
# （报 `Cannot resolve catalog protocol`）——这不是静默问题，装不上就是装不上。
#
# 已经有同名条目的，保留你自己的版本即可；下面的值是本套包在上游验证过的版本，
# 低于它们不保证可用（element-plus 尤其：`getControlProps` 的能力表按 2.14.5 的组件 d.ts 核对过）。

catalog:
  # ── shared-components 的 peerDependencies ──
  vue: ^3.5.41
  vue-router: ^5.2.0
  element-plus: ^2.14.5
  '@element-plus/icons-vue': ^2.3.2
  lodash-es: ^4.18.1

  # ── shared-components 的 devDependencies ──
  '@types/node': ^26.3.0
  async-validator: ^4.2.5 # element-plus 的校验内核，buildFormRules 的注释引用了它的源码行为

  vitest: ^4.1.11 # 两个包带着 .test.ts，不装它 typecheck 会报 Cannot find module 'vitest'

  # ── shared-unocss ──
  unocss: ^66.8.1
  '@iconify-json/ep': ^1.2.4 # presetIcons 的图标数据源，缺了图标会静默消失（不报错）
